# Publica somente a pasta site-modelo no GitHub Pages
name: Publicar site-modelo

on:
  push:
    branches: [main]       # roda a cada push na main
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-modelo    # pasta que vira a raiz do site
      - id: deployment
        uses: actions/deploy-pages@v4
